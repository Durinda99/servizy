<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Изменить позицию</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#D9D4CA;display:flex;justify-content:center}
a{color:#1F4FB4;text-decoration:none}a:hover{color:#163A86}
button,input,textarea{font:inherit;cursor:pointer}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F5F0; color: #1C2333; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<a href="Request.html" aria-label="Закрыть" style="flex: 1; min-height: 60px; display: block; background: #5F636B"></a><div style="display: flex; flex-direction: column; gap: 16px; padding: 10px 20px 24px; background: #FFFFFF; border-radius: 24px 24px 0 0; margin-top: -24px"><div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #D9D4CA"></div><h1 style="margin: 0; font-size: 20px; font-weight: 800">Изменить позицию</h1>
    <span style="margin-top: -10px; font-size: 14px; color: #5B6474; line-height: 1.4">Чашка чайная · 80.44694.00.1<br>Сервиз чайный «Саламандра Грей», Ирина Соколова</span>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: #F7F5F0; border-radius: 14px">
      <span style="font-size: 15px; font-weight: 600; line-height: 1.3">Нужно всего<br><span style="font-size: 13px; font-weight: 500; color: #5B6474">было 6</span></span><div style="display: flex; align-items: center; gap: 6px"><button aria-label="Меньше" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #D9D4CA; background: #FFFFFF; font-size: 22px; font-weight: 600; color: #1C2333">−</button><span style="width: 36px; text-align: center; font-size: 20px; font-weight: 800">5</span><button aria-label="Больше" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #D9D4CA; background: #FFFFFF; font-size: 22px; font-weight: 600; color: #1C2333">+</button></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; margin-top: -6px; font-size: 13px; color: #5B6474">
      <span>Уже куплено 2 — меньше 2 поставить нельзя.</span>
      <span style="color: #1C2333; font-weight: 700">Будет ждать: 3 шт</span>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 700; color: #5B6474">Заметка</span>
      <textarea rows="2" style="resize: none; padding: 12px; border: 1px solid #D9D4CA; border-radius: 12px; font-size: 15px; color: #1C2333; cursor: text">Одна чашка разбилась раньше, нужно 5, а не 6</textarea>
    </label>
    <span style="padding: 10px 12px; background: #EEF2FB; border-radius: 12px; font-size: 13px; line-height: 1.4">Это исправление заказа, а не покупка. Цена, дата записи 01.10.2026 и место в очереди сохранятся.</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><a href="Request.html" style="height: 52px; border-radius: 14px; border: 1px solid #D9D4CA; background: #FFFFFF; color: #1C2333; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">Отмена</a><a href="Request.html" style="height: 52px; border-radius: 14px; background: #1F4FB4; color: #FFFFFF; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-align: center">Сохранить</a></div></div>
</div>
</body>
</html>
