<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Снять с ожидания</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#D9D4CA;display:flex;justify-content:center}
a{color:#1F4FB4;text-decoration:none}a:hover{color:#163A86}
button,input,textarea{font:inherit;cursor:pointer}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F5F0; color: #1C2333; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<a href="Request.html" aria-label="Закрыть" style="flex: 1; min-height: 60px; display: block; background: #5F636B"></a><div style="display: flex; flex-direction: column; gap: 16px; padding: 10px 20px 24px; background: #FFFFFF; border-radius: 24px 24px 0 0; margin-top: -24px"><div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #D9D4CA"></div><h1 style="margin: 0; font-size: 20px; font-weight: 800">Снять с ожидания</h1>
    <span style="margin-top: -10px; font-size: 14px; color: #5B6474; line-height: 1.4">Блюдце чайное · 80.44695.00.1 · ждёт 4 шт<br>Сервиз чайный «Саламандра Грей», Ирина Соколова</span>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 700; color: #5B6474">Причина</span>
      <div style="display: flex; gap: 8px; flex-wrap: wrap"><button aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: #1C2333; color: #FFFFFF; font-weight: 700; font-size: 14px">Купил в другом месте</button><button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #D9D4CA; background: #FFFFFF; color: #1C2333; font-weight: 600; font-size: 14px">Передумал</button><button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #D9D4CA; background: #FFFFFF; color: #1C2333; font-weight: 600; font-size: 14px">Уже есть</button><button aria-pressed="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #D9D4CA; background: #FFFFFF; color: #1C2333; font-weight: 600; font-size: 14px">Другое…</button></div>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 700; color: #5B6474">Комментарий (необязательно)</span>
      <textarea rows="2" style="resize: none; padding: 12px; border: 1px solid #D9D4CA; border-radius: 12px; font-size: 15px; color: #1C2333; cursor: text">Нашла блюдца на распродаже</textarea>
    </label>
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: #F7F5F0; border-radius: 12px; font-size: 13px; line-height: 1.4">
      <span>Позиция перестанет попадать в подбор и уйдёт в архив запроса.</span>
      <span>Купленные 2 шт останутся в «Уже собрано».</span>
      <span>Из архива её можно вернуть или удалить навсегда.</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><a href="Request.html" style="height: 52px; border-radius: 14px; border: 1px solid #D9D4CA; background: #FFFFFF; color: #1C2333; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">Отмена</a><a href="Request.html" style="height: 52px; border-radius: 14px; background: #1F4FB4; color: #FFFFFF; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-align: center">Снять с ожидания</a></div></div>
</div>

</html>
